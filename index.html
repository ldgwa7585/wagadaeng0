<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genki Diner — Order</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;600&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --ink:#1C1B19;
  --paper:#FBF6EC;
  --paper-2:#F3ECDC;
  --chili:#C23B22;
  --chili-dark:#8F2A18;
  --soy:#C68A34;
  --stone:#786F60;
  --line:#E3DAC4;
  --white:#FFFFFF;
  --font-body:'IBM Plex Sans', sans-serif;
  --font-display:'Fraunces', serif;
}
body.lang-ja{
  --font-body:'Noto Sans JP', sans-serif;
  --font-display:'Noto Serif JP', serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  padding-bottom:96px;
}
.zh{ font-family:'Noto Serif TC', serif; }

/* ---------- header ---------- */
header{
  padding:22px 20px 16px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:1px solid var(--line);
}
.brand h1{
  font-family:var(--font-display);
  font-size:26px;
  font-weight:600;
  margin:0 0 2px;
  letter-spacing:0.2px;
}
.brand p{
  margin:0;
  font-size:13px;
  color:var(--stone);
}
.lang-switch{
  display:flex;
  border:1px solid var(--ink);
  border-radius:999px;
  overflow:hidden;
  flex-shrink:0;
}
.lang-switch button{
  border:none;
  background:transparent;
  padding:7px 14px;
  font-family:var(--font-body);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  color:var(--ink);
}
.lang-switch button.active{
  background:var(--ink);
  color:var(--paper);
}

/* ---------- categories ---------- */
.tabs{
  display:flex;
  gap:8px;
  padding:16px 20px 4px;
  overflow-x:auto;
}
.tabs button{
  flex-shrink:0;
  border:1px solid var(--line);
  background:var(--white);
  padding:8px 16px;
  border-radius:999px;
  font-family:var(--font-body);
  font-size:13px;
  color:var(--stone);
  cursor:pointer;
}
.tabs button.active{
  border-color:var(--chili);
  color:var(--chili-dark);
  background:#FBEAE4;
}

/* ---------- menu grid ---------- */
.grid{
  padding:14px 20px 20px;
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}
@media(min-width:640px){
  .grid{grid-template-columns:1fr 1fr;}
}
.card{
  position:relative;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:4px;
  padding:16px 16px 14px;
}
.stamp{
  position:absolute;
  top:12px;
  right:12px;
  width:34px;
  height:34px;
  border-radius:50%;
  border:1.5px solid var(--chili);
  color:var(--chili);
  display:flex;
  align-items:center;
  justify-content:center;
  transform:rotate(-8deg);
  font-size:16px;
  font-weight:700;
  opacity:0.85;
}
.card-name{
  font-family:var(--font-display);
  font-size:19px;
  font-weight:600;
  margin:0 68px 4px 0;
  line-height:1.3;
}
.card-ingredients{
  font-size:12.5px;
  color:var(--stone);
  margin:0 68px 10px 0;
  line-height:1.5;
}
.card-price{
  font-size:14px;
  color:var(--stone);
  margin:0 0 14px;
}
.card-note{
  font-size:12px;
  font-style:italic;
  color:var(--chili-dark);
  margin:0 0 10px;
}
.qty-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.add-btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:8px 18px;
  border-radius:4px;
  font-family:var(--font-body);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
}
.stepper{
  display:flex;
  align-items:center;
  gap:14px;
  border:1px solid var(--line);
  border-radius:4px;
  padding:4px 6px;
}
.stepper button{
  width:24px;
  height:24px;
  border:none;
  background:transparent;
  font-size:16px;
  cursor:pointer;
  color:var(--chili-dark);
}
.stepper span{
  min-width:14px;
  text-align:center;
  font-size:14px;
  font-weight:600;
}

/* ---------- floating cart bar ---------- */
.cartbar{
  position:fixed;
  left:0; right:0; bottom:0;
  background:var(--ink);
  color:var(--paper);
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transform:translateY(110%);
  transition:transform 0.25s ease;
  z-index:40;
}
.cartbar.show{ transform:translateY(0); }
.cartbar .info{ font-size:13px; color:#CFC7B4; }
.cartbar .total{
  font-family:var(--font-display);
  font-size:18px;
  color:var(--paper);
  margin-top:2px;
}
.cartbar button{
  background:var(--chili);
  color:var(--white);
  border:none;
  padding:11px 20px;
  border-radius:4px;
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

/* ---------- overlay + review sheet ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(20,18,15,0.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}
.overlay.show{ display:flex; }
.sheet{
  background:var(--paper);
  width:100%;
  max-width:480px;
  max-height:82vh;
  overflow-y:auto;
  border-radius:12px 12px 0 0;
  padding:20px 20px 24px;
}
.sheet h2{
  font-family:var(--font-display);
  font-size:20px;
  margin:0 0 14px;
}
.line-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.line-item .name{ font-size:14px; font-weight:500; flex:1; }
.line-item .remove{
  border:none; background:none; color:var(--stone);
  font-size:12px; text-decoration:underline; cursor:pointer;
  padding:4px;
}
.line-item-block{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}
.line-item-block .line-item{ padding:0 0 8px; border:none; }
.note-input{
  width:100%;
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px 10px;
  font-family:var(--font-body);
  font-size:13px;
  background:var(--paper-2);
  color:var(--ink);
}
.note-input::placeholder{ color:#A79E8C; }

/* ---------- modifier options ---------- */
.opt-group{ margin-bottom:18px; }
.opt-group-label{
  font-size:13px;
  font-weight:600;
  margin-bottom:2px;
}
.opt-group-required{
  font-size:11px;
  color:var(--chili-dark);
  margin-bottom:8px;
}
.opt-choice{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;
  cursor:pointer;
}
.opt-choice input{ accent-color:var(--chili); width:16px; height:16px; flex-shrink:0; }
.opt-choice .opt-name{ flex:1; }
.opt-choice .opt-price{ color:var(--stone); font-size:12.5px; }
.opt-sub{
  margin:10px 0 4px 26px;
  padding:10px 12px;
  background:var(--paper-2);
  border-radius:6px;
}
.opt-sub .opt-group-label{ font-size:12px; }
.opt-sub .opt-choice{ padding:6px 0; border-bottom:none; font-size:13px; }
.mod-qty-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:14px;
  gap:12px;
}
.mod-add-btn{
  flex:1;
  background:var(--chili);
  color:var(--white);
  border:none;
  padding:13px;
  border-radius:6px;
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.mod-add-btn:disabled{
  background:var(--line);
  color:var(--stone);
  cursor:not-allowed;
}
.select-opts-btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:8px 16px;
  border-radius:4px;
  font-family:var(--font-body);
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
}
.sheet-total{
  display:flex;
  justify-content:space-between;
  padding:16px 0 6px;
  font-family:var(--font-display);
  font-size:17px;
}
.confirm-btn{
  width:100%;
  margin-top:12px;
  background:var(--chili);
  color:var(--white);
  border:none;
  padding:14px;
  border-radius:6px;
  font-family:var(--font-body);
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}
.close-link{
  display:block;
  text-align:center;
  margin-top:10px;
  color:var(--stone);
  font-size:13px;
  background:none;
  border:none;
  cursor:pointer;
}
.empty-note{
  color:var(--stone);
  font-size:13px;
  text-align:center;
  padding:20px 0;
}

/* ---------- ticket ---------- */
.ticket-wrap{
  display:none;
  position:fixed; inset:0;
  background:rgba(20,18,15,0.7);
  align-items:center;
  justify-content:center;
  z-index:60;
  padding:24px;
}
.ticket-wrap.show{ display:flex; }
.ticket{
  background:var(--white);
  width:100%;
  max-width:360px;
  max-height:88vh;
  overflow-y:auto;
  padding:26px 24px 22px;
  position:relative;
}
.ticket:before{
  content:"";
  position:absolute;
  top:-13px; left:0; right:0; height:13px;
  background-image:
    linear-gradient(135deg, transparent 50%, var(--white) 50%),
    linear-gradient(45deg, var(--white) 50%, transparent 50%);
  background-size:16px 16px, 16px 16px;
  background-position:0 0, 8px 0;
  background-repeat:repeat-x;
}
.ticket-head{
  text-align:center;
  border-bottom:1px dashed var(--stone);
  padding-bottom:12px;
  margin-bottom:12px;
}
.ticket-head .zh{ font-size:20px; font-weight:700; }
.ticket-head .sub{ font-size:11px; color:var(--stone); margin-top:4px; }
.ticket-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:14px;
  padding:5px 0;
}
.ticket-row .zh{ font-weight:600; }
.ticket-row .meta{ color:var(--stone); font-size:12px; }
.ticket-note{
  font-size:12.5px;
  color:var(--chili-dark);
  padding:0 0 6px 4px;
  margin-top:-3px;
}
.ticket-total{
  display:flex;
  justify-content:space-between;
  border-top:1px dashed var(--stone);
  margin-top:10px;
  padding-top:10px;
  font-weight:700;
  font-size:15px;
}
.ticket-foot{
  text-align:center;
  font-size:11px;
  color:var(--stone);
  margin-top:16px;
}
.new-order-btn{
  width:100%;
  margin-top:18px;
  background:var(--ink);
  color:var(--paper);
  border:none;
  padding:13px;
  border-radius:6px;
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1 id="brandName">Genki Diner</h1>
    <p id="brandSub">Tap a language, build your order</p>
  </div>
  <div class="lang-switch">
    <button id="btnEn" class="active" onclick="setLang('en')">EN</button>
    <button id="btnJa" onclick="setLang('ja')">日本語</button>
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<div class="cartbar" id="cartbar">
  <div>
    <div class="info" id="cartInfo">0 items</div>
    <div class="total" id="cartTotal">NT$0</div>
  </div>
  <button onclick="openSheet()" id="reviewBtn">Review order</button>
</div>

<div class="overlay" id="overlay" onclick="closeSheetBg(event)">
  <div class="sheet">
    <h2 id="sheetTitle">Your order</h2>
    <div id="sheetItems"></div>
    <div class="sheet-total">
      <span id="sheetTotalLabel">Total</span>
      <span id="sheetTotalValue">NT$0</span>
    </div>
    <button class="confirm-btn" id="confirmBtn" onclick="submitOrder()">Send order to kitchen</button>
    <button class="close-link" id="closeLink" onclick="closeSheet()">Keep editing</button>
  </div>
</div>

<div class="overlay" id="modOverlay" onclick="closeModSheetBg(event)">
  <div class="sheet">
    <h2 id="modSheetTitle"></h2>
    <div id="modGroups"></div>
    <div class="mod-qty-row">
      <div class="stepper">
        <button onclick="modQtyChange(-1)">−</button>
        <span id="modQtyVal">1</span>
        <button onclick="modQtyChange(1)">+</button>
      </div>
      <button class="mod-add-btn" id="modAddBtn" onclick="confirmAddWithMods()"></button>
    </div>
    <button class="close-link" onclick="closeModSheet()" id="modCloseLink">Cancel</button>
  </div>
</div>

<div class="ticket-wrap" id="ticketWrap">
  <div class="ticket">
    <div class="ticket-head">
      <div class="zh">廚房出單</div>
      <div class="sub" id="ticketSub"></div>
    </div>
    <div id="ticketItems"></div>
    <div class="ticket-total">
      <span class="zh">總計</span>
      <span id="ticketTotal"></span>
    </div>
    <div class="ticket-foot" id="ticketFoot"></div>
    <button class="new-order-btn" id="newOrderBtn" onclick="resetOrder()">Start a new order</button>
  </div>
</div>

/* =========================================================
   MODIFIER GROUP RESOLUTION
   ========================================================= */
function getTopLevelGroups(item){
  if(item.cat === 'drinks'){
    return DRINK_SUBGROUPS[item.subGroupsKey || 'none'];
  }
  const groups = [];
  if(item.eggChoice){
    const variant = item.eggVariant || (item.eggDouble ? 'double' : 'single');
    const map = {double:EGG_GROUP_DOUBLE, single:EGG_GROUP_SINGLE, basic:EGG_GROUP_TOAST};
    groups.push(map[variant]);
  }
  if(item.hasSalad) groups.push(DRESSING_GROUP);
  if(item.breadUpgrade) groups.push(BREAD_GROUP);
  if(item.extraButter) groups.push(BUTTER_GROUP);
  if(item.pastaFull) groups.push(SAUCE_GROUP, NOODLE_GROUP, SPICE_GROUP);
  if(item.pastaNoodleSpice) groups.push(NOODLE_GROUP, SPICE_GROUP);
  if(item.kidsDrink) groups.push(KIDS_DRINK_GROUP);
  if(item.setUpgradeAvailable) groups.push(item.setUpgradeVariant === 'salad' ? SET_UPGRADE_GROUP_SALAD : SET_UPGRADE_GROUP);
  if(item.drinkCombo) groups.push(DRINK_GROUP);
  return groups;
}
function expandGroups(topGroups, sel){
  const result = [];
  function walk(list){
    list.forEach(g=>{
      result.push(g);
      const s = sel[g.id];
      if(s && s.choice && s.choice.subGroups && s.choice.subGroups.length){
        walk(s.choice.subGroups);
      }
    });
  }
  walk(topGroups);
  return result;
}
function getItemModGroups(item, sel){
  return expandGroups(getTopLevelGroups(item), sel || {});
}

    sheetTitle:'Your order',
    sheetTotalLabel:'Total',
    confirmBtn:'Send order to kitchen',
    closeLink:'Keep editing',
    empty:'No items yet — add something from the menu.',
    items:(n)=> n===1 ? '1 item' : n+' items',
    add:'Add',
    remove:'Remove',
    notePlaceholder:'Note (e.g. no onions, extra spicy)',
    noteTicketPrefix:'備註：',
    ticketSub:'Customer language: English',
    ticketFoot:'This ticket is for staff use — hand to the kitchen.',
    newOrderBtn:'Start a new order',
    selectOptions:'Select options',
    modCancel:'Cancel',
    modAdd:(price)=>'Add to cart · NT$'+price,
    modChooseFirst:'Choose an option above',
    priceTbd:'Price TBD',
    priceTbdBtn:'Price not set yet',
    required:'* Required',
  },
  ja:{
    brandSub:'言語を選んでご注文ください',
    reviewBtn:'注文を確認',
    sheetTitle:'ご注文内容',
    sheetTotalLabel:'合計',
    confirmBtn:'注文を送信する',
    closeLink:'注文を続ける',
    empty:'まだ商品がありません。メニューから選んでください。',
    items:(n)=> n+'点',
    add:'追加',
    remove:'削除',
    notePlaceholder:'備考（例：玉ねぎ抜き、辛さ増し）',
    noteTicketPrefix:'備註：',
    ticketSub:'お客様の言語：日本語',
    ticketFoot:'このチケットはスタッフ用です。厨房にお渡しください。',
    newOrderBtn:'新しい注文を始める',
    selectOptions:'オプションを選ぶ',
    modCancel:'キャンセル',
    modAdd:(price)=>'カートに追加 · NT$'+price,
    modChooseFirst:'上のオプションを選んでください',
    priceTbd:'価格未定',
    priceTbdBtn:'価格未設定',
    required:'※必須',
  }
};

/* =========================================================
   STATE
   ========================================================= */
let lang = 'en';
let activeCat = 'platters';
let cart = []; // array of {lineId, itemId, qty, mods, note}
let lineCounter = 0;
let ticketCounter = 42;

let modItem = null;
let modSelections = {}; // groupId -> {choice}
let modQty = 1;

/* =========================================================
   RENDER: header / tabs / grid
   ========================================================= */
function setLang(l){
  lang = l;
  document.body.className = 'lang-' + l;
  document.getElementById('btnEn').classList.toggle('active', l==='en');
  document.getElementById('btnJa').classList.toggle('active', l==='ja');
  renderAll();
}

function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  CATS.forEach(c=>{
    const b = document.createElement('button');
    b.textContent = c[lang];
    b.className = c.id === activeCat ? 'active' : '';
    b.onclick = ()=>{ activeCat = c.id; renderAll(); };
    t.appendChild(b);
  });
}

function findSimpleLine(itemId){
  return cart.find(l=>l.itemId===itemId && !l.mods);
}

function renderGrid(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  MENU.filter(m=>m.cat===activeCat).forEach(item=>{
    const hasMods = getTopLevelGroups(item).length > 0;
    const priceSet = typeof item.price === 'number';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="stamp zh">${item.zh[0]}</div>
      <p class="card-name">${item[lang]}</p>
      <p class="card-ingredients">${item.ing[lang].join(' · ')}</p>
      ${item.note ? `<p class="card-note">${item.note[lang]}</p>` : ''}
      <p class="card-price">${priceSet ? 'NT$'+item.price : T[lang].priceTbd}</p>
      <div class="qty-row" id="qtyrow-${item.id}"></div>
    `;
    g.appendChild(card);
    const row = document.getElementById('qtyrow-'+item.id);
    if(!priceSet){
      row.innerHTML = `<span></span><button class="add-btn" disabled style="background:var(--line);color:var(--stone);cursor:not-allowed;">${T[lang].priceTbdBtn}</button>`;
    } else if(hasMods){
      row.innerHTML = `<span></span><button class="select-opts-btn" onclick="openModSheet(${item.id})">${T[lang].selectOptions}</button>`;
    } else {
      const line = findSimpleLine(item.id);
      renderQtyRow(item.id, line ? line.qty : 0);
    }
  });
}

function renderQtyRow(id, qty){
  const row = document.getElementById('qtyrow-'+id);
  if(!row) return;
  if(qty === 0){
    row.innerHTML = `<span></span><button class="add-btn" onclick="changeQty(${id},1)">${T[lang].add}</button>`;
  } else {
    row.innerHTML = `
      <span></span>
      <div class="stepper">
        <button onclick="changeQty(${id},-1)">−</button>
        <span>${qty}</span>
        <button onclick="changeQty(${id},1)">+</button>
      </div>`;
  }
}

function changeQty(itemId, delta){
  let line = findSimpleLine(itemId);
  if(!line && delta>0){
    lineCounter += 1;
    line = {lineId:lineCounter, itemId, qty:0, mods:null, note:''};
    cart.push(line);
  }
  if(line){
    line.qty += delta;
    if(line.qty <= 0) cart = cart.filter(l=>l.lineId!==line.lineId);
  }
  renderGrid();
  renderCartBar();
}

/* =========================================================
   CART MATH
   ========================================================= */
function cartEntries(){
  return cart.map(line=>({line, item: MENU.find(m=>m.id===line.itemId)}));
}

function lineExtra(line, item){
  if(!line.mods) return 0;
  let extra = 0;
  getItemModGroups(item, line.mods).forEach(g=>{
    const sel = line.mods[g.id];
    if(sel) extra += sel.choice.price || 0;
  });
  return extra;
}

function lineUnitPrice(line, item){
  return item.price + lineExtra(line, item);
}

function cartTotal(){
  return cartEntries().reduce((sum,e)=>sum + lineUnitPrice(e.line, e.item)*e.line.qty, 0);
}

function cartCount(){
  return cart.reduce((sum,l)=>sum+l.qty, 0);
}

function renderCartBar(){
  const bar = document.getElementById('cartbar');
  const n = cartCount();
  bar.classList.toggle('show', n>0);
  document.getElementById('cartInfo').textContent = T[lang].items(n);
  document.getElementById('cartTotal').textContent = 'NT$'+cartTotal();
  document.getElementById('reviewBtn').textContent = T[lang].reviewBtn;
}

function renderStaticText(){
  document.getElementById('brandSub').textContent = T[lang].brandSub;
  document.getElementById('sheetTitle').textContent = T[lang].sheetTitle;
  document.getElementById('sheetTotalLabel').textContent = T[lang].sheetTotalLabel;
  document.getElementById('confirmBtn').textContent = T[lang].confirmBtn;
  document.getElementById('closeLink').textContent = T[lang].closeLink;
  document.getElementById('modCloseLink').textContent = T[lang].modCancel;
}

function renderAll(){
  renderTabs();
  renderGrid();
  renderCartBar();
  renderStaticText();
}

/* =========================================================
   MODIFIER SHEET
   ========================================================= */
function openModSheet(itemId){
  modItem = MENU.find(m=>m.id===itemId);
  modSelections = {};
  modQty = 1;
  document.getElementById('modQtyVal').textContent = modQty;
  document.getElementById('modSheetTitle').textContent = modItem[lang];
  renderModGroups();
  document.getElementById('modOverlay').classList.add('show');
}

function closeModSheet(){
  document.getElementById('modOverlay').classList.remove('show');
}
function closeModSheetBg(e){
  if(e.target.id === 'modOverlay') closeModSheet();
}

function pruneModSelections(){
  const validIds = new Set(getItemModGroups(modItem, modSelections).map(g=>g.id));
  Object.keys(modSelections).forEach(id=>{
    if(!validIds.has(id)) delete modSelections[id];
  });
}

function renderModGroups(){
  const wrap = document.getElementById('modGroups');
  wrap.innerHTML = '';
  const topIds = new Set(getTopLevelGroups(modItem).map(g=>g.id));
  const groups = getItemModGroups(modItem, modSelections);

  groups.forEach(g=>{
    let sel = modSelections[g.id];
    if(!sel && g.defaultId){
      sel = {choice: g.choices.find(c=>c.id===g.defaultId)};
      modSelections[g.id] = sel;
    }
    const isNested = !topIds.has(g.id);
    const container = document.createElement('div');
    container.className = isNested ? 'opt-sub' : 'opt-group';
    let html = `<div class="opt-group-label">${g.label[lang]}</div>`;
    if(g.required){
      html += `<div class="opt-group-required">${T[lang].required}</div>`;
    }
    g.choices.forEach(c=>{
      const checked = sel && sel.choice.id===c.id ? 'checked' : '';
      const priceLabel = c.price ? ` (+NT$${c.price})` : '';
      html += `
        <label class="opt-choice">
          <input type="radio" name="group-${g.id}" ${checked} onchange="selectModChoice('${g.id}','${c.id}')">
          <span class="opt-name">${c[lang]}</span>
          <span class="opt-price">${priceLabel}</span>
        </label>`;
    });
    container.innerHTML = html;
    wrap.appendChild(container);
  });

  updateModAddBtnState();
}

function revalidateModSelections(){
  // drop selections that are no longer among their (possibly dynamic) group's current choices
  const groups = getItemModGroups(modItem, modSelections);
  groups.forEach(g=>{
    const sel = modSelections[g.id];
    if(sel && !g.choices.find(c=>c.id===sel.choice.id)){
      delete modSelections[g.id];
    }
  });
}

function selectModChoice(groupId, choiceId){
  const groups = getItemModGroups(modItem, modSelections);
  const g = groups.find(x=>x.id===groupId);
  const choice = g.choices.find(c=>c.id===choiceId);
  modSelections[groupId] = {choice};
  revalidateModSelections();
  pruneModSelections();
  renderModGroups();
}

function modGroupsFulfilled(){
  return getItemModGroups(modItem, modSelections).every(g=>{
    if(!g.required) return true;
    return !!modSelections[g.id];
  });
}

function modUnitPrice(){
  let extra = 0;
  getItemModGroups(modItem, modSelections).forEach(g=>{
    const sel = modSelections[g.id];
    if(sel) extra += sel.choice.price || 0;
  });
  return modItem.price + extra;
}

function updateModAddBtnState(){
  const btn = document.getElementById('modAddBtn');
  const ok = modGroupsFulfilled();
  btn.disabled = !ok;
  btn.textContent = ok ? T[lang].modAdd(modUnitPrice()*modQty) : T[lang].modChooseFirst;
}

function modQtyChange(delta){
  modQty = Math.max(1, modQty + delta);
  document.getElementById('modQtyVal').textContent = modQty;
  updateModAddBtnState();
}

function confirmAddWithMods(){
  if(!modGroupsFulfilled()) return;
  lineCounter += 1;
  cart.push({
    lineId: lineCounter,
    itemId: modItem.id,
    qty: modQty,
    mods: JSON.parse(JSON.stringify(modSelections)),
    note: '',
  });
  closeModSheet();
  renderGrid();
  renderCartBar();
}

function modsSummary(item, mods, l){
  if(!mods) return '';
  const groups = getItemModGroups(item, mods);
  const parts = [];
  groups.forEach(g=>{
    const sel = mods[g.id];
    if(!sel) return;
    if(g.defaultId && sel.choice.id === g.defaultId) return;
    parts.push(sel.choice[l]);
  });
  return parts.join('，');
}

/* =========================================================
   REVIEW SHEET
   ========================================================= */
function openSheet(){
  const wrap = document.getElementById('sheetItems');
  wrap.innerHTML = '';
  const entries = cartEntries();
  if(entries.length === 0){
    wrap.innerHTML = `<p class="empty-note">${T[lang].empty}</p>`;
  } else {
    entries.forEach(e=>{
      const summary = modsSummary(e.item, e.line.mods, lang);
      const unit = lineUnitPrice(e.line, e.item);
      const block = document.createElement('div');
      block.className = 'line-item-block';
      block.innerHTML = `
        <div class="line-item">
          <span class="name">${e.item[lang]}${summary ? ' — '+summary : ''} ×${e.line.qty}</span>
          <span>NT$${unit*e.line.qty}</span>
          <button class="remove" onclick="removeItem(${e.line.lineId})">${T[lang].remove}</button>
        </div>
        <input class="note-input" type="text" placeholder="${T[lang].notePlaceholder}"
          value="${(e.line.note||'').replace(/"/g,'&quot;')}"
          oninput="updateLineNote(${e.line.lineId}, this.value)">
      `;
      wrap.appendChild(block);
    });
  }
  document.getElementById('sheetTotalValue').textContent = 'NT$'+cartTotal();
  document.getElementById('confirmBtn').style.display = entries.length ? 'block' : 'none';
  document.getElementById('overlay').classList.add('show');
}

function updateLineNote(lineId, val){
  const line = cart.find(l=>l.lineId===lineId);
  if(line) line.note = val;
}

function removeItem(lineId){
  cart = cart.filter(l=>l.lineId!==lineId);
  renderGrid();
  renderCartBar();
  openSheet();
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
}
function closeSheetBg(e){
  if(e.target.id === 'overlay') closeSheet();
}

/* =========================================================
   TICKET
   ========================================================= */
function submitOrder(){
  const entries = cartEntries();
  if(entries.length === 0) return;
  ticketCounter += 1;
  const now = new Date();
  const timeStr = now.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});

  document.getElementById('ticketSub').textContent =
    T[lang].ticketSub + ' · #' + ticketCounter + ' · ' + timeStr;

  const itemsWrap = document.getElementById('ticketItems');
  itemsWrap.innerHTML = '';
  entries.forEach(e=>{
    const summary = modsSummary(e.item, e.line.mods, 'zh');
    const unit = lineUnitPrice(e.line, e.item);
    const row = document.createElement('div');
    row.className = 'ticket-row';
    row.innerHTML = `
      <span class="zh">${e.item.zh}${summary ? '（'+summary+'）' : ''} ×${e.line.qty}</span>
      <span>NT$${unit*e.line.qty}</span>
    `;
    itemsWrap.appendChild(row);
    const note = (e.line.note||'').trim();
    if(note){
      const noteRow = document.createElement('div');
      noteRow.className = 'ticket-note';
      noteRow.textContent = T[lang].noteTicketPrefix + note;
      itemsWrap.appendChild(noteRow);
    }
  });
  document.getElementById('ticketTotal').textContent = 'NT$'+cartTotal();
  document.getElementById('ticketFoot').textContent = T[lang].ticketFoot;

  closeSheet();
  document.getElementById('ticketWrap').classList.add('show');
}

function resetOrder(){
  cart = [];
  document.getElementById('ticketWrap').classList.remove('show');
  document.getElementById('newOrderBtn').textContent = T[lang].newOrderBtn;
  renderAll();
}

// init
document.body.className = 'lang-en';
renderAll();
</script>
</body>
</html>
